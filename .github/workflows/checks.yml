name: Checks

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  local-integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: macos-latest
            python: '3.12'
          - os: ubuntu-22.04
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock && python -m pip install '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: ruff check src benchmarks hexstrike_mcp.py hexstrike_server.py
      - run: python -m pytest
      - run: python -m build
      - name: Verify curl installer from an unrelated project directory
        if: matrix.os == 'ubuntu-latest'
        run: python tests/installation/installer_acceptance.py dist/*.tar.gz
      - name: Clean install, MCP workflows, upgrade and uninstall
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/hexstrike-install"
          wheel=$(find "$PWD/dist" -name '*.whl' -print -quit)
          "$RUNNER_TEMP/hexstrike-install/bin/pip" install "$wheel[tui]"
          "$RUNNER_TEMP/hexstrike-install/bin/python" tests/installation/acceptance.py "$wheel"
