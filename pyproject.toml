[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hexstrike-ai"
dynamic = ["version"]
description = "MCP server for security tools, native execution, browser workflows and live telemetry"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "0x4m4" }
]
keywords = ["mcp", "security", "pentesting", "automation", "hexstrike", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "jsonschema>=4.23,<5",
    "httpx>=0.27,<1",
    "mcp>=2.0.0,<3.0.0",
    "psutil>=5.9.0,<8.0.0",
    "flask>=3.0.0,<4.0.0",
    "rich>=13.7.0,<16.0.0",
    "pyjwt>=2.8.0,<3.0.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.0.0,<3.0.0",
]
tui = [
    "textual>=0.80.0,<9.0.0",
    "rich>=13.7.0,<16.0.0",
]
browser = [
    "playwright>=1.48.0,<2.0.0",
]
memory = [
    "graphiti-core>=0.30.0,<0.32.0",
    "httpx>=0.27.0,<1.0.0",
]
dev = [
    "ruff>=0.11,<1.0",
    "build>=1.2,<2.0",
    "pytest>=8.0.0,<10.0.0",
    "textual>=0.80.0,<9.0.0",
    "mcp>=2.0.0,<3.0.0",
]
all = [
    "textual>=0.80.0,<9.0.0",
    "playwright>=1.48.0,<2.0.0",
    "graphiti-core>=0.30.0,<0.32.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.urls]
Repository = "https://github.com/Lyrie-ai/hexstrike-ai-beta"
Issues = "https://github.com/Lyrie-ai/hexstrike-ai-beta/issues"

[project.scripts]
hexstrike = "hexstrike.cli.main:main"
hexstrike-mcp = "hexstrike.transports.mcp_stdio:main"
hexstrike-server = "hexstrike.transports.http_server:main"

[tool.setuptools.dynamic]
version = { attr = "hexstrike.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff.lint]
select = ["F"]
